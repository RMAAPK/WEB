services:
- type: web
  name: rmaa-server
  runtime: docker
  plan: free
  region: oregon
  rootDir: backend
  dockerfilePath: Dockerfile
  healthCheckPath: /api/healthz
  domains:
  - s.rmaa.pk
  autoDeploy: true
  envVars:
  - key: PORT
    value: 10000
  - key: API_PORT
    value: 5174
  - key: FRONTEND_ORIGINS
    value: https://rmaa.pk,https://www.rmaa.pk
  - key: REPLICATE_API_TOKEN
    sync: false
  - key: REPLICATE_MODEL
    value: deepseek-ai/deepseek-v3.1
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_SERVICE_ROLE_KEY
    sync: false
  - key: MATRIX_UPSTREAM_URL
    value: http://127.0.0.1:6167
  - key: FEDIVERSE_UPSTREAM_URL
    value: http://127.0.0.1:8080
  - key: GTS_DB_ADDRESS
    sync: false
  - key: HF_TOKEN
    sync: false
  - key: HF_BACKUP_REPO
    value: rmaapk/rmaa-server-vault
  - key: R2_ACCOUNT_ID
    value: d547e9e8f4676375248a3b8d82e3f752
  - key: R2_ACCESS_KEY_ID
    value: 6df8fd748144a9466378955c04525965
  - key: R2_SECRET_ACCESS_KEY
    value: bd3b4c8beea28d3f04ac47ccfc6d50de34dd9be1a0d754e19807e2dd1a9bd1db
  - key: R2_BUCKET_NAME
    value: jfk-bkt
- type: web
  name: rmaa-holdings-frontend
  runtime: static
  rootDir: frontend
  buildCommand: npm ci && npm run build
  staticPublishPath: dist
  autoDeploy: true
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  envVars:
  - key: VITE_API_BASE_URL
    value: https://s.rmaa.pk
- type: web
  name: ali-cnc-litellm-proxy
  runtime: image
  image:
    url: ghcr.io/berriai/litellm:main-stable
  plan: free
  envVars:
  - key: PORT
    value: 4000
  - key: LITELLM_MASTER_KEY
    generateValue: true
  - key: LITELLM_CONFIG_PATH
    value: /app/litellm_config.yaml
  - key: REPLICATE_API_TOKEN
    sync: false
  - key: OPENAI_API_KEY
    sync: false
  - key: GEMINI_API_KEY
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: GROQ_API_KEY
    sync: false
  - key: TOGETHER_API_KEY
    sync: false
  - key: RUNPOD_API_KEY
    sync: false
  - key: RUNPOD_BASE_URL
    sync: false
