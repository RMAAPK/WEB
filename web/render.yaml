services:
  # Static React/Vite frontend. Attach rmaa.pk after detaching it from the
  # legacy Node website service in Render.
  - type: web
    name: rmaa-holdings-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://s.rmaa.pk

  # ── Ali CNC LiteLLM Proxy ──────────────────
  - type: web
    name: ali-cnc-litellm-proxy
    runtime: image
    image:
      url: ghcr.io/berriai/litellm:main-stable
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: LITELLM_CONFIG_PATH
        value: /app/litellm_config.yaml
      # Replicate
      - key: REPLICATE_API_TOKEN
        sync: false
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      # Google Gemini
      - key: GEMINI_API_KEY
        sync: false
      # Anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Groq
      - key: GROQ_API_KEY
        sync: false
      # Together AI
      - key: TOGETHER_API_KEY
        sync: false
      # RunPod
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_BASE_URL
        sync: false
