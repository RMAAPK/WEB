  <!-- ================= RMAA AI VISUAL PROMPT STUDIO ================= -->
  <style>
    #rmaa-ai-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2147483647;
      background: #090a0f;
      border: 1px solid #38bdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(56, 189, 248, 0.4);
      padding: 10px 18px;
      border-radius: 9999px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #rmaa-ai-pill.active {
      background: #0284c7;
      color: #fff;
      border-color: #7dd3fc;
    }
    .rmaa-target-hover {
      outline: 2px dashed #38bdf8 !important;
      outline-offset: 2px !important;
      cursor: pointer !important;
      background: rgba(56, 189, 248, 0.08) !important;
    }
  </style>

  <div id="rmaa-ai-pill">✨ AI Prompt Inspector: OFF</div>

  <script>
  (function() {
    let active = false;
    let hovered = null;
    const pill = document.getElementById('rmaa-ai-pill');

    pill.addEventListener('click', () => {
      active = !active;
      pill.classList.toggle('active', active);
      pill.innerText = active ? '🎯 Click Any Element To Prompt AI' : '✨ AI Prompt Inspector: OFF';
      if (!active && hovered) {
        hovered.classList.remove('rmaa-target-hover');
      }
    });

    document.addEventListener('mouseover', (e) => {
      if (!active) return;
      if (e.target.closest('#rmaa-ai-pill') || e.target.closest('#rmaa-prompt-modal')) return;
      if (hovered && hovered !== e.target) {
        hovered.classList.remove('rmaa-target-hover');
      }
      hovered = e.target;
      hovered.classList.add('rmaa-target-hover');
    }, true);

    document.addEventListener('mouseout', (e) => {
      if (!active) return;
      if (e.target.classList.contains('rmaa-target-hover')) {
        e.target.classList.remove('rmaa-target-hover');
      }
    }, true);

    document.addEventListener('click', (e) => {
      if (!active) return;
      if (e.target.closest('#rmaa-ai-pill') || e.target.closest('#rmaa-prompt-modal')) return;
      e.preventDefault();
      e.stopPropagation();

      const el = e.target;
      const tag = el.tagName.toLowerCase();
      const id = el.id ? '#' + el.id : '';
      const text = (el.innerText || '').slice(0, 140).trim();
      const htmlSnippet = el.outerHTML.slice(0, 300);

      openPromptModal(tag + id, text, htmlSnippet);
    }, true);

    function openPromptModal(selector, text, snippet) {
      let modal = document.getElementById('rmaa-prompt-modal');
      if (modal) modal.remove();

      modal = document.createElement('div');
      modal.id = 'rmaa-prompt-modal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2147483647;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;backdrop-filter:blur(6px);';
      
      modal.innerHTML = `
        <div style="background:#0b0f19;border:1px solid #38bdf8;padding:24px;border-radius:16px;width:90%;max-width:540px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,0.9);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <span style="font-size:12px;font-family:monospace;background:#1e293b;padding:4px 10px;border-radius:6px;color:#38bdf8;font-weight:bold;">Target: ${selector}</span>
            <button id="rmaa-modal-close" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;">✕</button>
          </div>
          <div style="font-size:12px;color:#94a3b8;background:#030712;padding:10px;border-radius:8px;margin-bottom:14px;max-height:60px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
            <strong>Selected:</strong> "${text || selector}"
          </div>
          <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px;color:#f8fafc;">Describe what AI should change here:</label>
          <textarea id="rmaa-ai-input" placeholder="e.g. Change background to dark slate, rewrite headline to focus on X, make this button red, remove this badge..." style="width:100%;height:90px;background:#030712;border:1px solid #334155;border-radius:8px;color:#fff;padding:12px;font-size:13px;resize:none;box-sizing:border-box;margin-bottom:16px;font-family:inherit;"></textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span id="rmaa-send-status" style="font-size:12px;font-family:monospace;color:#94a3b8;"></span>
            <button id="rmaa-send-btn" style="background:#0284c7;color:#fff;font-weight:800;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s ease;">🚀 Apply with AI</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);
      const input = document.getElementById('rmaa-ai-input');
      input.focus();

      document.getElementById('rmaa-modal-close').onclick = () => modal.remove();
      document.getElementById('rmaa-send-btn').onclick = async () => {
        const prompt = input.value.trim();
        if (!prompt) return;

        const statusEl = document.getElementById('rmaa-send-status');
        const sendBtn = document.getElementById('rmaa-send-btn');
        statusEl.innerText = 'Transmitting to AI...';
        sendBtn.disabled = true;

        try {
          const res = await fetch('http://localhost:5174/api/prompt-edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              selector: selector,
              currentText: text,
              htmlSnippet: snippet,
              prompt: prompt
            })
          });
          const data = await res.json();
          statusEl.innerText = '✅ Received by Antigravity!';
          statusEl.style.color = '#10b981';
          sendBtn.innerText = 'Dispatched!';
          sendBtn.style.background = '#10b981';
          setTimeout(() => modal.remove(), 800);
        } catch (err) {
          statusEl.innerText = '❌ Error: ' + err.message;
          statusEl.style.color = '#ef4444';
          sendBtn.disabled = false;
        }
      };
    }
  })();
  </script>
  <!-- ================= END RMAA AI VISUAL PROMPT STUDIO ================= -->
