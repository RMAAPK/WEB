<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMAA Accounts | Universal Authentication</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090A0F;
      --card-bg: rgba(18, 20, 29, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366F1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --success: #10B981;
      --error: #EF4444;
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 44px 36px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #A5B4FC;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .brand-pill span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }
    .auth-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      color: #FFF;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.35);
      margin-top: 8px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.45);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      margin-top: 10px;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }
    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      font-family: 'Fira Code', monospace;
      min-height: 20px;
      word-break: break-word;
    }
    .status-msg.error { color: var(--error); }
    .status-msg.success { color: var(--success); }
    .status-msg.info { color: #818CF8; }

    .user-profile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
      text-align: left;
    }
    .profile-field {
      margin-bottom: 10px;
    }
    .profile-field:last-child {
      margin-bottom: 0;
    }
    .profile-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .profile-val {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text-main);
      word-break: break-all;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 18px;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-pill">
      <span>●</span> RMAA UNIVERSAL SSO
    </div>

    <h1 class="auth-title">RMAA Accounts</h1>
    <p class="auth-subtitle">Non-custodial identity &amp; account management powered by Privy Engine.</p>

    <!-- State 1: Email Input Form -->
    <div id="email-step">
      <div class="form-group">
        <label for="email-input">Email Address</label>
        <input type="email" id="email-input" class="form-input" placeholder="you@domain.com" autocomplete="email" required>
      </div>

      <button id="send-code-btn" class="btn-submit" onclick="handleSendCode()">
        <span>✉️ Send Verification Code</span>
      </button>
    </div>

    <!-- State 2: OTP Verification Form -->
    <div id="otp-step" style="display: none;">
      <div class="form-group">
        <label for="otp-input">6-Digit Code</label>
        <input type="text" id="otp-input" class="form-input" placeholder="123456" maxlength="6" autocomplete="one-time-code">
      </div>

      <button id="verify-code-btn" class="btn-submit" onclick="handleVerifyCode()">
        <span>✓ Confirm &amp; Sign In</span>
      </button>

      <button class="btn-submit btn-secondary" onclick="resetForm()">
        <span>← Use Different Email</span>
      </button>
    </div>

    <!-- State 3: Authenticated User Profile -->
    <div id="authenticated-step" style="display: none;">
      <div class="user-profile">
        <div class="profile-field">
          <div class="profile-label">Authenticated Identity</div>
          <div id="profile-email" class="profile-val"></div>
        </div>
        <div class="profile-field">
          <div class="profile-label">Privy User ID</div>
          <div id="profile-id" class="profile-val"></div>
        </div>
        <div class="profile-field">
          <div class="profile-label">Embedded Web3 Wallet</div>
          <div id="profile-wallet" class="profile-val"></div>
        </div>
      </div>

      <button class="btn-submit btn-secondary" onclick="handleSignOut()">
        <span>Sign Out</span>
      </button>
    </div>

    <div id="status" class="status-msg"></div>

    <div class="footer-note">
      Direct non-custodial login. No unauthorized automatic redirects.<br>
      Powered by <strong>Privy Core</strong> &amp; RMAA Infrastructure.
    </div>
  </div>

  <script type="module">
    import { Privy } from 'https://cdn.jsdelivr.net/npm/@privy-io/js-sdk-core@0.36.0/+esm';

    const PRIVY_APP_ID = 'cmw08immb006s0gl5tw66yy2x';
    const privy = new Privy({ appId: PRIVY_APP_ID });

    let pendingEmail = '';

    const statusEl = document.getElementById('status');
    const emailStep = document.getElementById('email-step');
    const otpStep = document.getElementById('otp-step');
    const authStep = document.getElementById('authenticated-step');
    const emailInput = document.getElementById('email-input');
    const otpInput = document.getElementById('otp-input');
    const sendBtn = document.getElementById('send-code-btn');
    const verifyBtn = document.getElementById('verify-code-btn');

    function setStatus(msg, type = 'info') {
      statusEl.className = 'status-msg ' + type;
      statusEl.textContent = msg;
    }

    window.handleSendCode = async function() {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        setStatus('Please enter a valid email address.', 'error');
        return;
      }

      pendingEmail = email;
      sendBtn.disabled = true;
      setStatus('Sending one-time code to ' + email + '...', 'info');

      try {
        await privy.auth.email.sendCode(email);
        emailStep.style.display = 'none';
        otpStep.style.display = 'block';
        otpInput.focus();
        setStatus('Code sent! Please check your email inbox.', 'success');
      } catch (err) {
        setStatus(err.message || 'Failed to send verification code.', 'error');
        sendBtn.disabled = false;
      }
    };

    window.handleVerifyCode = async function() {
      const code = otpInput.value.trim();
      if (!code || code.length < 4) {
        setStatus('Please enter the verification code.', 'error');
        return;
      }

      verifyBtn.disabled = true;
      setStatus('Verifying code with Privy...', 'info');

      try {
        const result = await privy.auth.email.loginWithCode(pendingEmail, code);
        const user = result.user || result;
        showUserProfile(user);
        setStatus('Authenticated successfully!', 'success');
      } catch (err) {
        setStatus(err.message || 'Invalid or expired code.', 'error');
        verifyBtn.disabled = false;
      }
    };

    function showUserProfile(user) {
      emailStep.style.display = 'none';
      otpStep.style.display = 'none';
      authStep.style.display = 'block';

      const emailVal = user?.linked_accounts?.find(a => a.type === 'email')?.address || pendingEmail;
      const walletVal = user?.linked_accounts?.find(a => a.type === 'wallet')?.address || 'Created on demand';

      document.getElementById('profile-email').textContent = emailVal;
      document.getElementById('profile-id').textContent = user?.id || 'Connected';
      document.getElementById('profile-wallet').textContent = walletVal;
    }

    window.resetForm = function() {
      otpStep.style.display = 'none';
      authStep.style.display = 'none';
      emailStep.style.display = 'block';
      sendBtn.disabled = false;
      verifyBtn.disabled = false;
      otpInput.value = '';
      setStatus('', 'info');
    };

    window.handleSignOut = async function() {
      try {
        if (privy.auth && typeof privy.auth.logout === 'function') {
          await privy.auth.logout();
        }
      } catch (e) {
        console.warn('Logout:', e);
      }
      resetForm();
      setStatus('Signed out.', 'info');
    };

    // Check if user is already logged in
    try {
      if (privy.user) {
        showUserProfile(privy.user);
      }
    } catch (e) {}
  </script>
</body>
</html>
