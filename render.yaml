services:
  - type: web
    name: rmaa-server
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: MATRIX_UPSTREAM_URL
        value: http://127.0.0.1:6167
      - key: FEDIVERSE_UPSTREAM_URL
        value: http://127.0.0.1:8080
      - key: GTS_DB_ADDRESS
        sync: false # Set in Render dashboard: Supabase Postgres URI
      - key: HF_TOKEN
        sync: false # Set in Render dashboard: Hugging Face Access Token
      - key: HF_BACKUP_REPO
        value: rmaapk/rmaa-server-vault
      - key: R2_ACCOUNT_ID
        value: d547e9e8f4676375248a3b8d82e3f752
      - key: R2_ACCESS_KEY_ID
        value: 6df8fd748144a9466378955c04525965
      - key: R2_SECRET_ACCESS_KEY
        value: bd3b4c8beea28d3f04ac47ccfc6d50de34dd9be1a0d754e19807e2dd1a9bd1db
      - key: R2_BUCKET_NAME
        value: jfk-bkt

